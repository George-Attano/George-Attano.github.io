<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">WithinVAE preview</title>
  <desc id="desc">Conceptual illustration of compact visual autoencoding with self-distilled semantics.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#eef7f8"/>
      <stop offset="1" stop-color="#f5eee6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7aa6a8"/>
    </marker>
  </defs>
  <rect width="1120" height="630" rx="34" fill="url(#background)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="104" fill="#172632" font-size="64" font-weight="800">WithinVAE</text>
    <text x="66" y="154" fill="#47616b" font-size="29">Compact visual autoencoding</text>
    <g fill="#ffffff" stroke="#7aa6a8" stroke-width="3">
      <rect x="64" y="250" width="245" height="144" rx="20"/>
      <rect x="811" y="250" width="245" height="144" rx="20"/>
    </g>
    <g fill="#263b45" font-size="34" font-weight="600" text-anchor="middle">
      <text x="186" y="334">Encoder</text>
      <text x="934" y="334">Decoder</text>
    </g>
    <g fill="none" stroke="#7aa6a8" stroke-width="6" marker-end="url(#arrow)">
      <path d="M328 322 H420"/>
      <path d="M700 322 H790"/>
    </g>
    <g stroke="#ffffff" stroke-width="3">
      <rect x="445" y="275" width="42" height="94" rx="10" fill="#356a72"/>
      <rect x="493" y="275" width="42" height="94" rx="10" fill="#54848b"/>
      <rect x="541" y="275" width="42" height="94" rx="10" fill="#7aa6a8"/>
      <rect x="589" y="275" width="42" height="94" rx="10" fill="#9bbdbb"/>
      <rect x="637" y="275" width="42" height="94" rx="10" fill="#bdd2cd"/>
    </g>
    <text x="562" y="420" fill="#47616b" font-size="29" text-anchor="middle">Compact tokens</text>
    <rect x="216" y="482" width="688" height="76" rx="38" fill="#ffffff" stroke="#c9dfdc" stroke-width="2"/>
    <text x="560" y="530" fill="#1f5f67" font-size="31" font-weight="600" text-anchor="middle">Self-distilled semantics</text>
  </g>
</svg>
